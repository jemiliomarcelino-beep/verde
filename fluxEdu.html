<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{

display: grid;
grid-template-columns:200px ;
grid-template-rows: 100px 100px 100px 100px 100px;
text-align: center;
align-items: center;
padding: 20px;
gap: 10px;
margin-top: 200px;
row-gap: 90px;
margin-left:350px;


}

img{

width: 50vw;  
height: 70vh;

}

h1{
color:green;
margin-left: 300px;
font-size:50px;


}

.botoes{

display: grid;
grid-template-columns:200px ;
grid-template-rows: 100px 100px;
text-align: center;
align-items: center;
padding: 20px;
gap: 10px;
row-gap: 10px;
margin-left:270px;



}


.btn{
background-color: green;
border-radius: 50px;
height: 7vh;
color: whitesmoke;



}

.btn:hover{
  transform: scale(0.9);

}

.btn1:hover{

 transform: scale(0.9);
}

p:hover{

transform: scale(0.9);

}



.btn1{

background-color:whitesmoke;
border-radius: 50px ;
height: 7vh;
border:  2px solid green;
color: black;

}

.btn a{

text-decoration: none;
color: black;

}

.btn1 a{

text-decoration: none;
color: black;
}

p a{
text-decoration: none;
color: black;
}


/* Ajustes responsivos: preservam o estilo original em ecrãs grandes */
@media (max-width: 900px) {
    *, *::before, *::after {
        box-sizing: border-box;
    }

    .container {
        width: 100%;
        max-width: 100%;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto;
        margin: 40px auto 0;
        padding: 20px;
        gap: 18px;
    }

    img {
        display: block;
        width: min(80vw, 420px);
        height: auto;
        max-width: 100%;
        margin: 0 auto;
        object-fit: contain;
    }

    h1, #fluxEdu {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3.125rem);
        text-align: center;
    }

    .botoes {
        width: 100%;
        max-width: 360px;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto;
        margin: 0 auto;
        padding: 10px 0;
        gap: 12px;
    }

    .btn, .btn1 {
        width: 100%;
        min-height: 44px;
        height: auto;
        padding: 10px 18px;
    }

    .botoes p {
        margin: 0;
        text-align: center;
    }
}

@media (max-width: 480px) {
    .container {
        margin-top: 24px;
        padding: 14px;
        gap: 14px;
    }

    img {
        width: min(75vw, 320px);
    }

    .botoes {
        gap: 10px;
    }
}

    </style>
</head>
<body>
    
    <div class="container">

        <img src="imagem.png" alt="">

            <h1 id="fluxedu">FluxEdu</h1>


<section class="botoes">

<button class="btn"><a href="fluxEdu1.html">Entrar</a></button>
    <button class="btn1"><a href="fluxEdu2.html">Cadastrar-se</a></button>

    <p><a href="flexEdu4.html">Ja tem conta?</a></p>


    
</section>

    </div>



</body>
</html>
