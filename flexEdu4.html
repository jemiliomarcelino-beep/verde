<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{

display: grid;
grid-template-columns:200px ;
grid-template-rows: 100px 100px 100px 100px 100px;
text-align: center;
align-items: center;
padding: 20px;
gap: 10px;
margin-top: 200px;
row-gap:5px;
margin-left:350px;


}

img{

width: 50vw;  
height: 70vh;

}

h1{
color:green;
margin-left: 300px;
font-size:50px;
margin-top: 150px;


}

.sistema{
display: grid;
grid-template-columns:200px ;
grid-template-rows: 100px 100px 100px 100px;
text-align: center;
align-items: center;
padding:10px;
gap: 5px;
row-gap: 10px;
margin-left:100px;



}

input{
width: 40vw;
height: 30px;
margin-right: 800px;
border-radius:30px ;

}

.btn{
background-color: green;
border-radius: 50px;
height: 7vh;
width: 10vw;
color: whitesmoke;
padding: 50;
margin-left: 200px;  


}

.btn:hover{
transform: scale(0.9);

}

#do{
margin-top: 600px;
}

#nome{
margin-top: 250px;
}

#fluxEdu{
margin-top:200px ;
}

h3{
color: black;
display: flex;
justify-content: space-between;


}


#acessar  {
margin-right: 50px;

}

#acesso{


align-items: center;

}

/* Ajustes responsivos: preservam o estilo original em ecrãs grandes */
@media (max-width: 900px) {
    *, *::before, *::after {
        box-sizing: border-box;
    }

    .container {
        width: 100%;
        max-width: 100%;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto;
        margin: 40px auto 0;
        padding: 20px;
        gap: 18px;
    }

    img {
        display: block;
        width: min(80vw, 420px);
        height: auto;
        max-width: 100%;
        margin: 0 auto;
        object-fit: contain;
    }

    h1, #fluxEdu {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3.125rem);
        text-align: center;
    }

    .sistema {
        width: 100%;
        max-width: 480px;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto;
        margin: 0 auto;
        padding: 10px 0;
        gap: 12px;
    }

    #do, #nome {
        margin-top: 0;
    }

    h3 {
        justify-content: center;
        margin: 0;
    }

    input {
        display: block;
        width: 100%;
        max-width: 100%;
        height: 42px;
        margin: 0;
        padding: 0 14px;
    }

    #acessar {
        margin: 0;
        text-align: right;
    }

    .btn {
        width: 100%;
        min-height: 44px;
        height: auto;
        margin: 0;
        padding: 10px 20px;
    }

    .btn a {
        color: inherit;
        text-decoration: none;
    }

    br {
        display: none;
    }
}

@media (max-width: 480px) {
    .container {
        margin-top: 24px;
        padding: 14px;
        gap: 14px;
    }

    img {
        width: min(75vw, 320px);
    }

    .sistema {
        gap: 10px;
    }

    input {
        font-size: 16px;
    }
}





    </style>
</head>
<body>
    <div class="container">

        <img src="imagem.png" alt="">

            <h1 id="fluxedu">FluxEdu</h1>

            <section class="sistema">

                <h3 id="do" class="do">Cadastro</h3> <br>
    
            <input type="email" placeholder="digite seu email" id="nome"> <br>
     
            <input type="password" placeholder="digite sua senha">
            <p id="acessar"><a href="fluxEdu5.html">Esqueceu sua senha?</a></p> <br>  
            
            <br>
    
           
           
                <button class="btn"><a href="fluxEdu3.html">Entrar</a></button>
                
              

            </section>
    </div>
    

</body>
</html>
